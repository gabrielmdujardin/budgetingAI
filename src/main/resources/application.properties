# ═══════════════════════════════════════════════════════════════════
# API Financeira Inteligente — application.properties
# ═══════════════════════════════════════════════════════════════════

spring.application.name=budgeting

# ───────────────────────────────────────────────────────────────────
# BANCO DE DADOS — MySQL
# ───────────────────────────────────────────────────────────────────
# URL aponta para o container Docker (porta 3307 mapeada no compose.yml)
# createDatabaseIfNotExist=true: cria o schema automaticamente se não existir
spring.datasource.url=jdbc:mysql://localhost:3307/transaction?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=app
spring.datasource.password=app
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# update: atualiza o schema sem destruir dados (bom para desenvolvimento)
# Em produção, use 'validate' ou migrações com Flyway/Liquibase
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ───────────────────────────────────────────────────────────────────
# SPRING AI — OLLAMA (LLM Local)
# ───────────────────────────────────────────────────────────────────
# Ollama deve estar rodando em http://localhost:11434 (instalação padrão)
# Execute antes: ollama pull qwen3:8b
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen3:8b

# Temperatura: controla a "criatividade" do modelo
# 0.0 = determinístico (ideal para tool calling e extração de dados)
# 1.0 = muito criativo (ideal para texto livre)
spring.ai.ollama.chat.options.temperature=0.0

# Timeout para requisições ao Ollama (modelos locais podem demorar)
# Ajuste conforme seu hardware (máquinas mais lentas podem precisar de mais tempo)
spring.ai.ollama.chat.options.num-ctx=4096

# ───────────────────────────────────────────────────────────────────
# FASTER-WHISPER — Transcrição de Áudio (Local)
# ───────────────────────────────────────────────────────────────────
# URL do container faster-whisper-server (veja compose.yml)
# Esta propriedade é customizada — usada em AudioTranscriptionService.java
app.whisper.base-url=http://localhost:8000
app.whisper.model=Systran/faster-whisper-small
app.whisper.language=pt

# Saldo inicial usado pelo assistente de voz para responder perguntas como
# "quanto tenho de saldo?". Valor em centavos: 500000 = R$ 5.000,00.
app.finances.opening-balance-cents=500000

# ───────────────────────────────────────────────────────────────────
# SWAGGER / OPENAPI
# ───────────────────────────────────────────────────────────────────
# Swagger UI: http://localhost:8080/swagger-ui.html
# JSON da spec: http://localhost:8080/api-docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ───────────────────────────────────────────────────────────────────
# UPLOAD DE ARQUIVOS
# ───────────────────────────────────────────────────────────────────
# Limite de tamanho para upload de áudio (padrão Spring é 1MB — insuficiente)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ───────────────────────────────────────────────────────────────────
# LOGGING
# ───────────────────────────────────────────────────────────────────
logging.level.dio.budgeting=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.level.org.hibernate.SQL=DEBUG
